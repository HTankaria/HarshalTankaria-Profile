name: Deploy AITO Simulator to GitHub Pages

on:
  push:
    branches: [main, claude/rf-power-design-assistant-dxZQb]
    paths: [aito-simulator/**, .github/workflows/deploy-aito.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aito-simulator/package-lock.json

      - run: npm ci
        working-directory: aito-simulator

      - run: npm run build
        working-directory: aito-simulator
        env:
          GITHUB_PAGES: "true"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: aito-simulator/dist
          destination_dir: aito
          keep_files: true
